name: Market Data Daily

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: africa-monitor-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect market evidence
        id: collect
        continue-on-error: true
        run: python scripts/run_collectors.py --group market
      - name: Commit verified data and crawler status
        if: always()
        run: |
          git config user.name "africa-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh public market evidence"
            git push
          fi
      - name: Fail workflow if collector failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
